[package]
name = "neco-cad-observer"
version = "0.1.0"
edition = "2021"
default-run = "neco-cad-observer"

[workspace]

[dependencies]
serde = "1.0"
serde_json = "1.0"
sha2 = "0.10"
neco-mesh = { path = "../../neco-mesh", version = "=0.3.0", features = ["std"] }

[[bin]]
name = "neco-cad-observer"
path = "src/main.rs"

[[bin]]
name = "neco-cad-control-probe"
path = "src/bin/control_probe.rs"
