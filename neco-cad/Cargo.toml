[package]
name = "neco-cad"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "CAD engine API that builds boundary representations, tessellations, and meshes from algebraic regions"
repository.workspace = true
documentation = "https://docs.rs/neco-cad"
readme = "README.md"
keywords = ["cad", "geometry", "modeling"]
categories = ["mathematics", "no-std"]
include = ["Cargo.toml", "src/**/*.rs", "tests/adaptive_tessellation.rs", "tests/analytic_brep.rs", "tests/boundary_derivation.rs", "tests/construction_api.rs", "tests/engine_operations.rs", "tests/numeric_projection.rs", "tests/public_api.rs", "tests/semantic_integration.rs", "README.md", "README-ja.md", "LICENSE"]

[features]
default = ["std"]
std = [
    "neco-brep/std",
    "neco-cad-import/std",
    "neco-geometry/std",
    "neco-mesh/std",
    "neco-nurbs/std",
    "neco-algnum/std",
    "neco-bigint/std",
    "neco-tessellation/std",
]

[dependencies]
neco-brep = { path = "../neco-brep", version = "0.3.0", default-features = false }
neco-cad-import = { path = "../neco-cad-import", version = "0.3.0", default-features = false }
neco-mesh = { path = "../neco-mesh", version = "0.3.0", default-features = false }
neco-nurbs = { path = "../neco-nurbs", version = "0.3.0", default-features = false }
neco-tessellation = { path = "../neco-tessellation", version = "0.3.0", default-features = false }
neco-geometry = { path = "../../../neco-geometry/neco-geometry-main/neco-geometry", version = "0.2.0", default-features = false }
neco-calculus = { path = "../../../neco-calculus/neco-calculus-main/neco-calculus", version = "0.2.0", default-features = false }
neco-algnum = { path = "../../../neco-algebra/neco-algebra-main/neco-algnum", version = "=0.1.2", default-features = false }
neco-bigint = { path = "../../../neco-algebra/neco-algebra-main/neco-bigint", version = "=0.1.2", default-features = false }

[dev-dependencies]
