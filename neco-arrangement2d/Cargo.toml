[package]
name = "neco-arrangement2d"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Two-dimensional curve arrangements"
repository.workspace = true
documentation = "https://docs.rs/neco-arrangement2d"
keywords = ["geometry", "arrangement", "cad"]
categories = ["mathematics", "no-std"]
include = ["Cargo.toml", "src/**/*.rs", "tests/arrangement_construction.rs", "tests/parameter_association.rs", "tests/planar_topology.rs", "tests/reference_set.rs", "README.md", "README-ja.md", "LICENSE"]
readme = "README.md"

[features]
default = ["std"]
std = ["neco-geometry/std", "neco-calculus/std", "neco-algnum/std"]

[dependencies]
neco-geometry = { path = "../../../neco-geometry/neco-geometry-main/neco-geometry", version = "0.2.0", default-features = false }
neco-calculus = { path = "../../../neco-calculus/neco-calculus-main/neco-calculus", version = "0.2.0", default-features = false }
neco-algnum = { path = "../../../neco-algebra/neco-algebra-main/neco-algnum", version = "=0.1.2", default-features = false }

[dev-dependencies]
neco-bigint = { path = "../../../neco-algebra/neco-algebra-main/neco-bigint", version = "=0.1.2", default-features = false }
