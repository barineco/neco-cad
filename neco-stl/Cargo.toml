[package]
name = "neco-stl"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "STL surface mesh codec"
repository.workspace = true
documentation = "https://docs.rs/neco-stl"
readme = "README.md"
keywords = ["stl", "mesh", "cad"]
categories = ["mathematics", "no-std"]
include = ["Cargo.toml", "src/**/*.rs", "tests/codec.rs", "README.md", "README-ja.md", "LICENSE"]

[features]
default = ["std"]
std = ["neco-mesh/std"]

[dependencies]
neco-mesh = { path = "../neco-mesh", version = "0.3.0", default-features = false }
